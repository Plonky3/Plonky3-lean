[[mirror]]
lean = "p3_zk_codes.reed_solomon.mirror.ReedSolomonZkEncoding.randomness_row_iter"
rust = "p3_zk_codes::reed_solomon::ReedSolomonZkEncoding::randomness_row_iter"

[[mirror]]
lean = "p3_zk_codes.reed_solomon.mirror.ReedSolomonZkEncoding.message_row"
rust = "{impl p3_zk_codes::encoding::LinearZkEncoding<F> for p3_zk_codes::reed_solomon::ReedSolomonZkEncoding<F, Dft>}::message_row"

[[mirror]]
