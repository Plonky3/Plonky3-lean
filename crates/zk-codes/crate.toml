# p3-zk-codes: zero-knowledge Reed-Solomon encodings (eprint 2026/391, Section 3.2.1).

lean_lib = "P3ZkCodes"

# Nothing is extracted.
#
# The encoding is generic over p3-field's trait hierarchy and over the transform backend, which aeneas rejects (docs/extractor-issues.md 9).
#
# Each item is transcribed over a field in stub/P3ZkCodes/, with the abstractions its file header lists.
state = "stub"

features = []

watch = ["zk-codes/src", "zk-codes/Cargo.toml", "dft/src/traits.rs", "util/src/lib.rs"]

# The transcriptions. Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_zk_codes.reed_solomon.mirror.ReedSolomonZkEncoding.new"
rust = "p3_zk_codes::reed_solomon::ReedSolomonZkEncoding::new"

[[mirror]]
lean = "p3_zk_codes.reed_solomon.mirror.ReedSolomonZkEncoding.evaluation_point"
rust = "p3_zk_codes::reed_solomon::ReedSolomonZkEncoding::evaluation_point"

[[mirror]]
lean = "p3_zk_codes.reed_solomon.mirror.ReedSolomonZkEncoding.message_row_iter"
