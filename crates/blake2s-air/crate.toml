# p3-blake2s-air: the BLAKE2s compression function as an AIR over a field of characteristic 2.

lean_lib = "P3Blake2sAir"

# The integer code is extracted: the constants, the G step on words, and the bit-sliced helpers of the packed generator.
#
# The AIR evaluation and the trace generator are generic over the builder and the field traits, which aeneas rejects (docs/extractor-issues.md 9).
#
# They are transcribed in extraction/P3Blake2sAir/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_blake2s_air::constants::IV",
  "p3_blake2s_air::constants::SIGMA",
  "p3_blake2s_air::binary::G_SCHEDULE",
  "p3_blake2s_air::binary::generation::g_words",
  "p3_blake2s_air::binary::generation::carries_word",
  "p3_blake2s_air::binary::generation::input_words",
  "p3_blake2s_air::binary::generation::transpose_bits",
  "p3_blake2s_air::binary::generation::add_planes",
  "p3_blake2s_air::binary::generation::xor_rotate_right",
]

watch = ["blake2s-air/src", "blake2s-air/Cargo.toml"]

# The transcriptions in extraction/P3Blake2sAir/Assumptions/Mirror/.
# Hashes are pending tools/mirror.
#
# The packed generator is transcribed as well.
#
# Plonky3Lean/Proofs/Blake2sAir/PackedGen.lean proves that it returns the packing of the trace.
#
# Plonky3Lean/Proofs/Blake2sAir/Extracted.lean proves the transcribed constants and G step on words equal to the extracted ones.

[[mirror]]
lean = "p3_blake2s_air.mirror.IV"
rust = "p3_blake2s_air::constants::IV"

[[mirror]]
lean = "p3_blake2s_air.mirror.SIGMA"
