# p3-multilinear-util: multilinear tables over the Boolean cube (Thaler, "Proofs, Arguments, and Zero-Knowledge", Section 3.5).

lean_lib = "P3MultilinearUtil"

# The equality polynomial of two points is extracted.
#
# The rest is generic over p3-field's packed types, which aeneas rejects (docs/extractor-issues.md 9).
#
# It is transcribed over a field in extraction/P3MultilinearUtil/Mirror/, with the abstractions Mirror/Model.lean lists.
state = "scoped"

features = []

# One root: the `hax_roots` module that pre-patch 020 adds under cfg(hax_backend_lean).
# Its one function calls one item, with the fields left generic.
start_from = ["p3_multilinear_util::hax_roots"]

watch = ["multilinear-util/src", "multilinear-util/Cargo.toml", "field/src/packed", "maybe-rayon/src/task_size.rs"]

# The transcriptions. Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_multilinear_util.point.mirror.Point.split_at"
rust = "p3_multilinear_util::point::Point::split_at"

