# p3-batch-stark: the multi-table STARK prover and verifier.

lean_lib = "P3BatchStark"

# The integer helpers: the batch's opening count and the shape's two counters.
#
# Everything else is generic over the configuration, the field traits and the AIR, which aeneas rejects (docs/extractor-issues.md 9).
#
# It is transcribed in extraction/P3BatchStark/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_batch_stark::security::num_batched_openings",
  "p3_batch_stark::transcript::BatchShape::num_instances",
  "p3_batch_stark::transcript::BatchShape::has_lookups",
]

watch = ["batch-stark/src", "batch-stark/Cargo.toml", "lookup/src/protocol.rs", "lookup/src/types.rs", "challenger/src/fs"]

# The transcriptions in extraction/P3BatchStark/Assumptions/Mirror/.
# Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_batch_stark.transcript.mirror.BatchShape"
rust = "p3_batch_stark::transcript::BatchShape"

[[mirror]]
lean = "p3_batch_stark.transcript.mirror.BatchShape.num_instances"
