# p3-word-backend: the proving backend for word-level constraint systems.

lean_lib = "P3WordBackend"

# Nothing is extracted.
#
# The crate's dependency p3-binary-pcs does not compile in the variant charon reads (docs/extractor-issues.md 180).
#
# Its reductions are generic over the field and challenger traits, which aeneas rejects (docs/extractor-issues.md 9).
#
# The key codes, the relation columns, the shift transpose and the exponent lift are transcribed in stub/P3WordBackend/.
state = "stub"

features = []

watch = ["word-backend/src", "word-backend/Cargo.toml"]

# The transcriptions. Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_word_backend.keys.code.mirror.ShiftCode.new"
rust = "p3_word_backend::keys::code::ShiftCode::new"

