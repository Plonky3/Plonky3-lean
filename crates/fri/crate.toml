# p3-fri: the FRI low-degree test and the two-adic FRI polynomial commitment scheme.

lean_lib = "P3Fri"

# Nothing is extracted.
#
# Every item is generic over p3-field's trait hierarchy, the matrix commitment scheme and the challenger, which aeneas rejects (docs/extractor-issues.md 9).
#
# The folding, the schedule, the prover, the verifier and the opening reduction are transcribed over a field in stub/P3Fri/, with the abstractions each file lists.
state = "stub"

features = []

watch = ["fri/src", "fri/Cargo.toml", "util/src/lib.rs", "field/src/helpers.rs", "challenger/src/grinding_challenger.rs", "challenger/src/duplex_challenger.rs"]

# The transcriptions. Hashes are pending tools/mirror.

