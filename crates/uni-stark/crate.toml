# p3-uni-stark: the single-table STARK prover and verifier.

lean_lib = "P3UniStark"

# The integer helpers: the degree-bits validation, the batched-opening count, and the opening layout.
#
# Everything else is generic over the configuration, the field traits and the builder, which aeneas rejects (docs/extractor-issues.md 9).
#
# It is transcribed in extraction/P3UniStark/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_uni_stark::verifier::validate_degree_bits",
  "p3_uni_stark::security::num_batched_openings",
  "p3_uni_stark::config::StarkOpeningLayout::new",
]

watch = ["uni-stark/src", "uni-stark/Cargo.toml", "air/src/symbolic/builder.rs", "field/src/field.rs", "matrix/src/lib.rs", "util/src/lib.rs", "util/src/zip_eq.rs"]

# The transcriptions in extraction/P3UniStark/Assumptions/Mirror/.
# Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_uni_stark.folder.mirror.ConstraintLayout"
rust = "p3_air::symbolic::builder::ConstraintLayout"

[[mirror]]
lean = "p3_uni_stark.folder.mirror.ConstraintLayout.total_constraints"
rust = "p3_air::symbolic::builder::ConstraintLayout::total_constraints"

[[mirror]]
