# p3-util: shared helpers. The prime fields use its GCD-based inversion.

lean_lib = "P3Util"

# Only the inversion is extracted. The rest of the crate is unsafe transposes
# and iterator helpers that no field claim needs.
state = "scoped"

features = []

# `MontyField31::try_inverse` calls the inversion with `FIELD_BITS = 31`.
start_from = ["p3_util::gcd_inversion_prime_field_32"]

watch = ["util/src", "util/Cargo.toml"]
