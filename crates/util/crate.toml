# p3-util: shared helpers. The prime fields use its GCD-based inversion.

lean_lib = "P3Util"

# Only the inversions are extracted. The rest of the crate is unsafe transposes
# and iterator helpers that no field claim needs, and `branch_hint`, whose
# inline `asm!` aeneas rejects. It is transcribed in
# extraction/P3Util/Assumptions/Mirror.lean.
state = "scoped"

features = []

# `MontyField31::try_inverse` calls the inversion with `FIELD_BITS = 31`.
# Goldilocks's inversion calls `gcd_inner` twice.
start_from = ["p3_util::gcd_inversion_prime_field_32", "p3_util::gcd_inner"]

watch = ["util/src", "util/Cargo.toml"]

# The transcription in extraction/P3Util/Assumptions/Mirror.lean. Hashes are
# pending tools/mirror; until it exists, the transcription is re-read by hand
# when a commit in `watch` touches it.
[[mirror]]
lean = "p3_util.branch_hint"
rust = "p3_util::branch_hint"
