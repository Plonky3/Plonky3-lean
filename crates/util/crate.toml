# p3-util: shared helpers.
#
# The prime fields invert through its binary GCD.

lean_lib = "P3Util"

# Only the inversion is extracted.
#
# The rest is transposes and iterator helpers, which no field claim needs.
state = "scoped"

features = []

# Monty31 inversion calls it with 31-bit fields.
start_from = ["p3_util::gcd_inversion_prime_field_32"]

watch = ["util/src", "util/Cargo.toml"]
