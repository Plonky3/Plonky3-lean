# p3-koala-bear: the KoalaBear field and its Poseidon1/Poseidon2 parameters.

lean_lib = "P3KoalaBear"
state = "extracted"

# Cargo features enabled for extraction.
#
# The target comes from toolchain.toml.
features = []

# The whole crate is extracted, so there are no charon roots.
start_from = []

# What can change this crate's model.
#
# Its own sources, and the sources the pre-extraction patches touch.
watch = [
  "koala-bear/src",
  "koala-bear/Cargo.toml",
  "field/src",
  "symmetric/src",
  "matrix/src",
  "Cargo.toml",
  "Cargo.lock",
]
