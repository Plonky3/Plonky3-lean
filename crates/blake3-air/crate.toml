# p3-blake3-air: the BLAKE3 compression function as an AIR, over a prime field of characteristic above 3 * 2^16 and over a field of characteristic 2.

lean_lib = "P3Blake3Air"

# The integer code is extracted: the constants, the message permutation, the half quarter-round of the generator, and the characteristic-2 G step on words.
#
# The AIR evaluations and the trace generators are generic over the builder and the field traits, which aeneas rejects (docs/extractor-issues.md 9).
#
# They are transcribed in extraction/P3Blake3Air/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_blake3_air::constants::IV",
  "p3_blake3_air::constants::MSG_PERMUTATION",
  "p3_blake3_air::generation::verifiable_half_round",
  "p3_blake3_air::binary::G_SCHEDULE",
  "p3_blake3_air::binary::iv_word",
  "p3_blake3_air::binary::generation::g_words",
  "p3_blake3_air::binary::generation::input_words",
]

watch = ["blake3-air/src", "blake3-air/Cargo.toml"]

# The transcriptions in extraction/P3Blake3Air/Assumptions/Mirror/.
# Hashes are pending tools/mirror.
#
# Plonky3Lean/Proofs/Blake3Air/Extracted.lean proves the transcribed constants, half quarter round and carry word equal to the extracted ones.

