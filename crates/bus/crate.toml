# p3-bus: the binary-native multiset bus, its grand-product reduction, and its memory arguments.

lean_lib = "P3Bus"

# Nothing is extracted.
#
# The crate's dependencies p3-multilinear-util and p3-sumcheck do not compile in the extraction variant (docs/extractor-issues.md 180).
#
# Most items are also generic over the field traits or the builder, which aeneas rejects (docs/extractor-issues.md 9).
#
# Each item is transcribed in stub/P3Bus/, with the abstractions each file's header lists.
state = "stub"

features = []

watch = ["bus/src", "bus/Cargo.toml", "security/src/bus.rs", "multilinear-util/src/point.rs", "sumcheck/src/generic_degree"]

# The transcriptions. Hashes are pending tools/mirror.

