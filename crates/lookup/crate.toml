# p3-lookup: the LogUp lookup argument over AIRs (Haboeck, eprint 2022/1530).

lean_lib = "P3Lookup"

# The count record, the indexed column check and the gadget's constructor.
#
# Everything else is generic over the field traits or over the builder, which aeneas rejects (docs/extractor-issues.md 9).
#
# The indexed declaration check returns from inside a loop (docs/extractor-issues.md 23).
#
# It is transcribed in extraction/P3Lookup/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_lookup::count::Count::bounded",
  "p3_lookup::count::Count::provided",
  "p3_lookup::count::Count::weight",
  "p3_lookup::count::Count::into_parts",
  "p3_lookup::indexed::IndexedLookups::check_columns",
  "p3_lookup::indexed::IndexedLookups::is_empty",
  "p3_lookup::indexed::IndexedLookups::reads",
  "p3_lookup::indexed::IndexedLookups::tables",
  "p3_lookup::logup::LogUpGadget::new",
]

watch = ["lookup/src", "lookup/Cargo.toml", "field/src/batch_inverse.rs", "air/src/symbolic"]

# The transcriptions in extraction/P3Lookup/Assumptions/Mirror/.
# Hashes are pending tools/mirror.
#
# The transcribed indexed column check restates the extracted one, and is not yet proven equal to it.

[[mirror]]
lean = "p3_lookup.mirror.Kind"
rust = "p3_lookup::types::Kind"

