# p3-sumcheck: the sumcheck protocol (Thaler, "Proofs, Arguments, and Zero-Knowledge", Section 4.1).

lean_lib = "P3Sumcheck"

# The round arithmetic of the quadratic verifier: interpolation through 0, 1 and infinity, and the claim reduction of both bases.
#
# The round loop is generic over p3-challenger's sponges and needs `ExtensionField`, which aeneas rejects (pre-patch 030 says why).
#
# The loop and the rest of the verifier core are transcribed over a field in extraction/P3Sumcheck/Mirror/, with the abstractions Mirror/Model.lean lists.
state = "scoped"

features = []

# One root: the `hax_roots` module that pre-patch 030 adds under cfg(hax_backend_lean).
# Each of its functions calls one item, with the field left generic.
start_from = ["p3_sumcheck::hax_roots"]

watch = ["sumcheck/src", "sumcheck/Cargo.toml", "field/src/helpers.rs"]

# The transcriptions. Hashes are pending tools/mirror.
#
# The three lagrange transcriptions and `Basis::reduce_claim` are also extracted.
# Claims/Sumcheck.lean proves each extracted item returns what its transcription computes.

[[mirror]]
lean = "p3_sumcheck.lagrange.mirror.lagrange_weights_01inf"
rust = "p3_sumcheck::lagrange::lagrange_weights_01inf"

[[mirror]]
lean = "p3_sumcheck.lagrange.mirror.lagrange_weights_01inf_multi"
rust = "p3_sumcheck::lagrange::lagrange_weights_01inf_multi"

[[mirror]]
lean = "p3_sumcheck.lagrange.mirror.extrapolate_01inf"
rust = "p3_sumcheck::lagrange::extrapolate_01inf"

[[mirror]]
