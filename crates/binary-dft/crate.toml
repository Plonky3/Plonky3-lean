# p3-binary-dft: the additive NTT over F_2-linear subspaces of the binary tower.

lean_lib = "P3BinaryDft"

# Extracted, generic over the tower-level and butterfly traits:
#
# - the domain points, the domain steps and the subspace polynomials;
# - the twiddle state, the stage pass, the tile stages, the schedule, the blocked run and the forward and inverse transform.
#
# P3BinaryField declares the tower-level trait by hand; aeneas emits the butterfly trait.
#
# Pre-patch 010 reshapes the domain steps, whose closure updates a captured variable (docs/extractor-issues.md 60).
#
# Pre-patch 020 reshapes the twiddle state and the stage kernels, which drive mutable chunk iterators through closures (docs/extractor-issues.md 14 and 60).
#
# The staged group of a pool of 16 workers or more stays opaque, through `charon_args` below.
#
# Not extracted: the butterfly kernels themselves (SIMD intrinsics and raw pointers, docs/extractor-issues.md 12), the staged coset pass and the staging buffers (lch/schedule.rs `run_cosets`, staging.rs), and the polynomial-basis transform (poly/).
#
# The transcriptions in extraction/P3BinaryDft/Mirror/ remain the specifications the extracted kernels are proven equal to.
state = "scoped"

start_from = [
  "p3_binary_dft::domain::domain_point",
  "p3_binary_dft::domain::domain_point_steps",
  "p3_binary_dft::domain::subspace_polynomial",
  "p3_binary_dft::lch::transform",
]

features = []

# Passed to charon after toolchain.toml's `charon_args`, for this crate only.
#   fused_group -> opaque: a staged group of stages runs only on a pool of 16 workers or more.
#                  The serial pool has one, so the transform never reaches it.
#                  Its body drives the staging buffers through rayon's `for_each_init`, which aeneas rejects.
charon_args = [
  "--opaque", "p3_binary_dft::lch::schedule::fused_group",
]

watch = ["binary-dft/src", "binary-dft/Cargo.toml", "binary-field/src/tower.rs", "util/src/lib.rs", "commit/src/encoder.rs"]

