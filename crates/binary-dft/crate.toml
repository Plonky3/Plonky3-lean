# p3-binary-dft: the additive NTT over F_2-linear subspaces of the binary tower.

lean_lib = "P3BinaryDft"

# The domain points and the subspace polynomials are extracted.
#
# They stay generic over the tower-level trait, whose Lean structure P3BinaryField declares by hand.
#
# The transforms use rayon iterators, raw pointers, SIMD intrinsics and a `const` generic `bool` that picks a kernel (docs/extractor-issues.md 12, 14 and 61).
#
# The domain steps accumulate in a closure over a mutable capture, whose back function CoreModels cannot take (60).
#
# Each of them is transcribed over a field in extraction/P3BinaryDft/Mirror/, with the abstractions its file header lists.
#
# Not transcribed: the staged coset pass and the staging buffers (lch/schedule.rs `run_cosets`, staging.rs), the polynomial-basis transform (poly/), and the SIMD kernels.
state = "scoped"

start_from = [
  "p3_binary_dft::domain::domain_point",
  "p3_binary_dft::domain::subspace_polynomial",
]

features = []

watch = ["binary-dft/src", "binary-dft/Cargo.toml", "binary-field/src/tower.rs", "util/src/lib.rs", "commit/src/encoder.rs"]

# The transcriptions. Hashes are pending tools/mirror.

