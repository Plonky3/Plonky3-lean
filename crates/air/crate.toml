# p3-air: the AIR framework.

lean_lib = "P3Air"

# The integer helpers: the boundary-cell row and validation, the conversion of a polynomial degree to a constraint degree, and the degrees of a symbolic variable.
#
# Everything else is generic over the field traits or over the builder, which aeneas rejects (docs/extractor-issues.md 9).
#
# It is transcribed in extraction/P3Air/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_air::boundary::BoundaryPublic::row",
  "p3_air::boundary::validate",
  "p3_air::symbolic::builder::constraint_degree_from_poly_degree",
  "p3_air::symbolic::variable::SymbolicVariable::degree_multiple",
  "p3_air::symbolic::variable::SymbolicVariable::poly_degree",
  "p3_air::symbolic::variable::SymbolicVariableExt::degree_multiple",
  "p3_air::symbolic::variable::SymbolicVariableExt::poly_degree",
]

watch = ["air/src", "air/Cargo.toml"]

# The transcriptions in extraction/P3Air/Assumptions/Mirror/.
# Hashes are pending tools/mirror.
#
# Seven of them restate extracted items over natural numbers, for the transcribed checker to call.
#
# Plonky3Lean/Proofs/Air/Extracted.lean proves the extracted degree helpers and boundary row equal to them.
#
# The boundary validation is not yet proven equal: only its duplicate scan is.

