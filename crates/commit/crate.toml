# p3-commit: polynomial domains, commitment-scheme traits and periodic columns.

lean_lib = "P3Commit"

# Nothing is extracted.
#
# Every item is generic over p3-field's trait hierarchy, which aeneas rejects (docs/extractor-issues.md 9).
#
# The coset's polynomial space, the periodic columns, the trait defaults and the trivial scheme are transcribed over a field in stub/P3Commit/.
#
# The scheme traits themselves are contracts, stated in Plonky3Lean/Spec/Commit.lean.
state = "stub"

features = []

watch = ["commit/src", "commit/Cargo.toml", "field/src/coset.rs", "matrix/src/interpolation.rs", "util/src/lib.rs"]

# The transcriptions. Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_commit.domain.mirror.LagrangeSelectors"
rust = "p3_commit::domain::LagrangeSelectors"

[[mirror]]
lean = "p3_commit.domain.mirror.Coset.size"
rust = "{impl p3_commit::domain::PolynomialSpace for p3_field::coset::TwoAdicMultiplicativeCoset<Val>}::size"

