# p3-monty-31: 31-bit Montgomery-form fields, the parameter traits p3-baby-bear
# implements.

lean_lib = "P3Monty31"

# Only the items p3-baby-bear refers to are extracted, rooted at `start_from`.
# Extracting the whole crate fails: it reaches p3-field's mutually recursive
# trait hierarchy, which aeneas rejects (docs/extractor-issues.md, 9). What the
# scoped run does not produce is in extraction/P3Monty31/Assumptions/.
state = "scoped"

features = []

# Charon roots, one `--start-from` each. Charon splits option values on ',', so
# an impl pattern cannot name two generic arguments (docs/extractor-issues.md, 8).
start_from = [
  "p3_monty_31::data_traits::MontyParameters",
  "p3_monty_31::data_traits::PackedMontyParameters",
  "p3_monty_31::data_traits::BarrettParameters",
  "p3_monty_31::data_traits::FieldParameters",
  "p3_monty_31::data_traits::RelativelyPrimePower",
  "p3_monty_31::data_traits::TwoAdicData",
  "p3_monty_31::data_traits::BinomialExtensionData",
  "p3_monty_31::mds::MDSUtils",
  "p3_monty_31::poseidon1::PartialRoundBaseParameters",
  "p3_monty_31::poseidon1::PartialRoundParameters",
  "p3_monty_31::poseidon2::InternalLayerBaseParameters",
  "p3_monty_31::poseidon2::InternalLayerParameters",
  "p3_monty_31::monty_31::MontyField31::new",
  "{impl core::clone::Clone for p3_monty_31::monty_31::MontyField31<_>}",
  # The scalar arithmetic on Montgomery-form u32s, which the `Add`, `Sub`,
  # `Mul` and `Neg` impls and `halve` wrap (transcribed in Mirror.lean).
  "p3_monty_31::utils::add",
  "p3_monty_31::utils::sub",
  "p3_monty_31::utils::monty_reduce",
  "p3_monty_31::utils::from_monty",
  "p3_monty_31::utils::halve_u32",
  # The conversions into Montgomery form from every integer width, and the
  # reductions that dot_product and try_inverse rely on.
  "p3_monty_31::utils::to_monty_signed",
  "p3_monty_31::utils::to_monty_64",
  "p3_monty_31::utils::to_monty_64_signed",
  "p3_monty_31::utils::large_monty_reduce",
  "p3_monty_31::utils::monty_reduce_u128",
]

watch = ["monty-31/src", "monty-31/Cargo.toml"]

# The transcriptions in extraction/P3Monty31/Assumptions/Mirror.lean. Hashes
# are pending tools/mirror; until it exists, the transcriptions are re-read by
# hand when a commit in `watch` touches them.
[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.new_array"
rust = "p3_monty_31::monty_31::MontyField31::new_array"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.new_2d_array"
rust = "p3_monty_31::monty_31::MontyField31::new_2d_array"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.new_monty"
rust = "p3_monty_31::monty_31::MontyField31::new_monty"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.add"
rust = "{impl core::ops::arith::Add for p3_monty_31::monty_31::MontyField31<_>}::add"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.sub"
rust = "{impl core::ops::arith::Sub for p3_monty_31::monty_31::MontyField31<_>}::sub"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.mul"
rust = "{impl core::ops::arith::Mul for p3_monty_31::monty_31::MontyField31<_>}::mul"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.neg"
rust = "{impl core::ops::arith::Neg for p3_monty_31::monty_31::MontyField31<_>}::neg"

# `neg` also transcribes `Self::ZERO = FP::MONTY_ZERO`, a second Rust item, so
# a change to either must reach it.
[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.neg"
rust = "{impl p3_field::field::PrimeCharacteristicRing for p3_monty_31::monty_31::MontyField31<_>}::ZERO"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.halve"
rust = "{impl p3_field::field::PrimeCharacteristicRing for p3_monty_31::monty_31::MontyField31<_>}::halve"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon1.Poseidon1InternalLayerMonty31"
rust = "p3_monty_31::no_packing::poseidon1::Poseidon1InternalLayerMonty31"

[[mirror]]
