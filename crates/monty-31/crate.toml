# p3-monty-31: 31-bit Montgomery-form fields.
#
# It defines the parameter traits p3-baby-bear and p3-koala-bear implement.

lean_lib = "P3Monty31"

# Only the items reachable from `start_from` are extracted.
#
# Extracting the whole crate fails on p3-field's trait hierarchy (docs/extractor-issues.md, 9).
#
# What the scoped run does not produce is in extraction/P3Monty31/Assumptions/.
state = "scoped"

features = []

# Charon roots, one `--start-from` each. Charon splits option values on ',', so
# an impl pattern cannot name two generic arguments (docs/extractor-issues.md, 8).
start_from = [
  "p3_monty_31::data_traits::MontyParameters",
  "p3_monty_31::data_traits::PackedMontyParameters",
  "p3_monty_31::data_traits::BarrettParameters",
  "p3_monty_31::data_traits::FieldParameters",
  "p3_monty_31::data_traits::RelativelyPrimePower",
  "p3_monty_31::data_traits::TwoAdicData",
  "p3_monty_31::data_traits::BinomialExtensionData",
  "p3_monty_31::data_traits::TrinomialQuinticData",
  "p3_monty_31::mds::MDSUtils",
  "p3_monty_31::poseidon1::PartialRoundBaseParameters",
  "p3_monty_31::poseidon1::PartialRoundParameters",
  "p3_monty_31::poseidon2::InternalLayerBaseParameters",
  "p3_monty_31::poseidon2::InternalLayerParameters",
  "p3_monty_31::monty_31::MontyField31::new",
  "{impl core::clone::Clone for p3_monty_31::monty_31::MontyField31<_>}",
  # The scalar arithmetic on Montgomery-form u32s, which the `Add`, `Sub`,
  # `Mul` and `Neg` impls and `halve` wrap (transcribed in Mirror.lean).
  "p3_monty_31::utils::add",
  "p3_monty_31::utils::sub",
  "p3_monty_31::utils::monty_reduce",
  "p3_monty_31::utils::from_monty",
  "p3_monty_31::utils::halve_u32",
  # Conversions into Montgomery form, from every integer width.
  #
  # Wide reductions, which dot products and inversion rely on.
  "p3_monty_31::utils::to_monty_signed",
  "p3_monty_31::utils::to_monty_64",
  "p3_monty_31::utils::to_monty_64_signed",
  "p3_monty_31::utils::large_monty_reduce",
  "p3_monty_31::utils::monty_reduce_u128",
  # Every item transcribed in Mirror.lean is also a root, so that
  # extraction/gaps.toml shows what charon does with it (translated and dropped,
  # or not translated), and a fix upstream shows up there first.
  "p3_monty_31::monty_31::MontyField31::new_monty",
  "p3_monty_31::monty_31::MontyField31::new_array",
  "p3_monty_31::monty_31::MontyField31::new_2d_array",
  "{impl core::ops::arith::Add for p3_monty_31::monty_31::MontyField31<_>}::add",
  "{impl core::ops::arith::Sub for p3_monty_31::monty_31::MontyField31<_>}::sub",
  "{impl core::ops::arith::Mul for p3_monty_31::monty_31::MontyField31<_>}::mul",
  "{impl core::ops::arith::Neg for p3_monty_31::monty_31::MontyField31<_>}::neg",
  "p3_monty_31::monty_31::MontyField31::MONTY_POWERS_OF_TWO",
  # One-line wrappers, compiled only for extraction (pre-patch
  # 010-extraction-roots), for the methods a pattern cannot root: the
  # `QuotientMap<uN>` impls, and provided-method overrides charon skips when
  # nothing calls them.
  "p3_monty_31::hax_roots",
]

watch = ["monty-31/src", "monty-31/Cargo.toml"]

# The transcriptions in extraction/P3Monty31/Assumptions/Mirror.lean. Hashes
# are pending tools/mirror; until it exists, the transcriptions are re-read by
# hand when a commit in `watch` touches them.

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon1.Poseidon1InternalLayerMonty31"
rust = "p3_monty_31::no_packing::poseidon1::Poseidon1InternalLayerMonty31"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon1.Poseidon1ExternalLayerMonty31"
rust = "p3_monty_31::no_packing::poseidon1::Poseidon1ExternalLayerMonty31"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon2.Poseidon2InternalLayerMonty31"
rust = "p3_monty_31::no_packing::poseidon2::Poseidon2InternalLayerMonty31"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon2.Poseidon2ExternalLayerMonty31"
rust = "p3_monty_31::no_packing::poseidon2::Poseidon2ExternalLayerMonty31"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon1.Poseidon1InternalLayerMonty31.Insts.P3_poseidon1InternalPartialRoundLayerConstructorMontyField31WIDTH"
rust = "{impl p3_poseidon1::internal::PartialRoundLayerConstructor for p3_monty_31::no_packing::poseidon1::Poseidon1InternalLayerMonty31}"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon1.Poseidon1ExternalLayerMonty31.Insts.P3_poseidon1ExternalFullRoundLayerConstructorMontyField31WIDTH"
rust = "{impl p3_poseidon1::external::FullRoundLayerConstructor for p3_monty_31::no_packing::poseidon1::Poseidon1ExternalLayerMonty31}"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon2.Poseidon2InternalLayerMonty31.Insts.P3_poseidon2InternalInternalLayerConstructorMontyField31"
rust = "{impl p3_poseidon2::internal::InternalLayerConstructor for p3_monty_31::no_packing::poseidon2::Poseidon2InternalLayerMonty31}"

[[mirror]]
lean = "p3_monty_31.no_packing.poseidon2.Poseidon2ExternalLayerMonty31.Insts.P3_poseidon2ExternalExternalLayerConstructorMontyField31WIDTH"
rust = "{impl p3_poseidon2::external::ExternalLayerConstructor for p3_monty_31::no_packing::poseidon2::Poseidon2ExternalLayerMonty31}"

# Inversion, powers of two and integer conversions, in Mirror.lean.
#
# Squaring and exponentiation are trait defaults, transcribed for this field.

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.square"
rust = "p3_field::field::PrimeCharacteristicRing::square"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.exp_u64"
rust = "p3_field::field::PrimeCharacteristicRing::exp_u64"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.exp_u64.step"
rust = "p3_field::field::PrimeCharacteristicRing::exp_u64"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.mul_2exp_u64"
rust = "{impl p3_field::field::PrimeCharacteristicRing for p3_monty_31::monty_31::MontyField31<_>}::mul_2exp_u64"

[[mirror]]
lean = "p3_monty_31.monty_31.MontyField31.try_inverse"
rust = "{impl p3_field::field::Field for p3_monty_31::monty_31::MontyField31<_>}::try_inverse"












# `PackedMontyField31AVX2`'s arithmetic, extracted for x86_64 with AVX2 against
# the intrinsic models (pre-patch 020). The scalar modules are opaque: the
# variant takes `MontyField31` and its functions from P3Monty31, by the
# bindings in variants/x86_64-avx2/extraction/P3Monty31Avx2/Assumptions/.
# Its own namespace, since the run re-declares the parameter traits, and on
# x86_64 `PackedMontyParameters` has the supertrait `MontyParametersAVX2`.
[[variant]]
name = "x86_64-avx2"
target = "x86_64-unknown-linux-gnu"
target_features = ["avx2"]
lean_lib = "P3Monty31Avx2"
namespace = "p3_monty_31_avx2"
start_from = [
  "{impl core::ops::arith::Add for p3_monty_31::x86_64_avx2::packing::PackedMontyField31AVX2<_>}::add",
  "{impl core::ops::arith::Sub for p3_monty_31::x86_64_avx2::packing::PackedMontyField31AVX2<_>}::sub",
  "{impl core::ops::arith::Neg for p3_monty_31::x86_64_avx2::packing::PackedMontyField31AVX2<_>}::neg",
  "{impl core::ops::arith::Mul for p3_monty_31::x86_64_avx2::packing::PackedMontyField31AVX2<_>}::mul",
  "p3_monty_31::x86_64_avx2::utils::halve_avx2",
]
opaque = [
  "p3_monty_31::monty_31",
  "p3_monty_31::utils",
]

# `PackedMontyField31Neon`'s arithmetic, extracted for AArch64 against the
# intrinsic models (pre-patch 030, under which `confuse_compiler`, an `asm!`
# optimisation barrier, is the identity). As for x86_64-avx2: the scalar
# modules are opaque, and bound to P3Monty31 by
# variants/aarch64-neon/extraction/P3Monty31Neon/Assumptions/. Its own
# namespace, since on AArch64 `PackedMontyParameters` has the supertrait
# `MontyParametersNeon`.
[[variant]]
name = "aarch64-neon"
target = "aarch64-unknown-linux-gnu"
target_features = ["neon"]
lean_lib = "P3Monty31Neon"
namespace = "p3_monty_31_neon"
start_from = [
  "{impl core::ops::arith::Add for p3_monty_31::aarch64_neon::packing::PackedMontyField31Neon<_>}::add",
  "{impl core::ops::arith::Sub for p3_monty_31::aarch64_neon::packing::PackedMontyField31Neon<_>}::sub",
  "{impl core::ops::arith::Neg for p3_monty_31::aarch64_neon::packing::PackedMontyField31Neon<_>}::neg",
  "{impl core::ops::arith::Mul for p3_monty_31::aarch64_neon::packing::PackedMontyField31Neon<_>}::mul",
  "p3_monty_31::aarch64_neon::utils::halve_neon",
]
opaque = [
  "p3_monty_31::monty_31",
  "p3_monty_31::utils",
]
