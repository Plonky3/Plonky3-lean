# p3-dft: discrete Fourier transforms over two-adic subgroups.

lean_lib = "P3Dft"

# Nothing is extracted.
#
# Every backend is generic over p3-field's trait hierarchy, which aeneas rejects (docs/extractor-issues.md 9).
#
# A wrapper at a concrete field does not help: the generic impl it calls still needs the trait dictionary.
#
# The backends also use rayon iterators, raw pointers, transmute and uninitialised memory (items 12 and 14).
#
# Each item is transcribed over a field in stub/P3Dft/, with the abstractions its file header lists.
state = "stub"

features = []

watch = ["dft/src", "dft/Cargo.toml", "matrix/src/dense.rs", "matrix/src/util.rs", "util/src/lib.rs"]

# The transcriptions. Hashes are pending tools/mirror.

[[mirror]]
lean = "p3_dft.butterflies.mirror.DitButterfly.apply"
rust = "{impl p3_dft::butterflies::Butterfly<F> for p3_dft::butterflies::DitButterfly<F>}::apply"

