# p3-multi-stark: the multilinear SuperSpartan-style STARK prover and verifier for AIRs.

lean_lib = "P3MultiStark"

# Nothing is extracted.
#
# Code over `ExtensionField` does not extract (docs/extractor-issues.md 180).
#
# Its items are also generic over the field traits and the AIR, which aeneas rejects (docs/extractor-issues.md 9).
#
# The verifier's own checks are transcribed in stub/P3MultiStark/, with the abstractions each file's header lists.
state = "stub"

features = []

watch = ["multi-stark/src", "multi-stark/Cargo.toml", "security/src/multilinear.rs", "multilinear-util/src/point.rs"]

# The transcriptions. Hashes are pending tools/mirror.

