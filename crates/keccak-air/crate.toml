# p3-keccak-air: the Keccak-f[1600] permutation as an AIR, over a field of size at least 2^16 and over a field of characteristic 2.

lean_lib = "P3KeccakAir"

# The integer code is extracted: the tables and the characteristic-2 round on words.
#
# The AIR evaluations and the trace generators are generic over the builder and the field traits, which aeneas rejects (docs/extractor-issues.md 9).
#
# They are transcribed in extraction/P3KeccakAir/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_keccak_air::constants::R",
  "p3_keccak_air::constants::RC",
  "p3_keccak_air::constants::RC_BITS",
  "p3_keccak_air::binary::rho_pi_source",
  "p3_keccak_air::binary::generation::keccak_round",
]

watch = ["keccak-air/src", "keccak-air/Cargo.toml"]
