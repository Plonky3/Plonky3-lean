# p3-mersenne-31: the prime field F_p, p = 2^31 - 1, and its extensions.

lean_lib = "P3Mersenne31"

# Only the scalar field is extracted. The whole crate reaches p3-field's mutually
# recursive trait hierarchy, which aeneas rejects (docs/extractor-issues.md, 9).
state = "scoped"

features = []

# One root: the `hax_roots` module that pre-patch 010 adds under
# cfg(hax_backend_lean). Rooted at the methods themselves, aeneas drops every
# method that no free function calls (docs/extractor-issues.md, 4); each
# function of that module calls one method, so its body is extracted.
start_from = ["p3_mersenne_31::hax_roots"]

watch = ["mersenne-31/src", "mersenne-31/Cargo.toml"]
