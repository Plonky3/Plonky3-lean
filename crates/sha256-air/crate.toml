# p3-sha256-air: the SHA-256 compression function as an AIR, over a prime field and over a field of characteristic 2.

lean_lib = "P3Sha256Air"

# The integer code is extracted: the constants, the limb split, and the four sigma functions of the characteristic-2 generator.
#
# The AIR evaluations and the trace generators are generic over the builder and the field traits, which aeneas rejects (docs/extractor-issues.md 9).
#
# They are transcribed in extraction/P3Sha256Air/Assumptions/Mirror/.
state = "scoped"

features = []

start_from = [
  "p3_sha256_air::constants::SHA256_K",
  "p3_sha256_air::constants::SHA256_IV",
  "p3_sha256_air::constants::u32_to_limbs",
  "p3_sha256_air::binary::rotr_index",
  "p3_sha256_air::binary::generation::big_sigma0",
  "p3_sha256_air::binary::generation::big_sigma1",
  "p3_sha256_air::binary::generation::small_sigma0",
  "p3_sha256_air::binary::generation::small_sigma1",
]

watch = ["sha256-air/src", "sha256-air/Cargo.toml"]

# The transcriptions in extraction/P3Sha256Air/Assumptions/Mirror/.
# Hashes are pending tools/mirror.
#
# The packed generator is transcribed as well.
#
# Plonky3Lean/Proofs/Sha256Air/Binary/Packed.lean proves that it returns the packing of the trace.
#
# Plonky3Lean/Proofs/Sha256Air/Extracted.lean proves the transcribed constants and sigma functions equal to the extracted ones.

