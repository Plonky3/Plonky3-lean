# p3-stir: the STIR low-degree test and PCS (Arnon, Chiesa, Fenzi and Yogev, eprint 2024/390).

lean_lib = "P3Stir"

# Nothing is extracted.
#
# The crate is generic over p3-field's trait hierarchy, the MMCS and the challenger, which aeneas rejects (docs/extractor-issues.md 9).
#
# The round operators, the verifier's query checks and the PCS Combine coefficients are transcribed over a field in stub/P3Stir/.
#
# The abstractions are listed in stub/P3Stir/Model.lean.
#
# The transcript, the prover's DFT calls, the PCS layer and the f64 parameter schedule are not transcribed.
state = "stub"

features = []

watch = ["stir/src", "stir/Cargo.toml", "field/src/batch_inverse.rs", "field/src/field.rs"]

# The transcriptions. Hashes are pending tools/mirror.

