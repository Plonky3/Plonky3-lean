# p3-circle: Circle STARKs over the circle x^2 + y^2 = 1 (Haböck, Levit, Papini, eprint 2024/278).

lean_lib = "P3Circle"

# Nothing is extracted.
#
# Every item is generic over p3-field's trait hierarchy (ComplexExtendable, ExtensionField), which aeneas rejects (docs/extractor-issues.md 9).
#
# A wrapper at Mersenne31 does not help: the generic impl it calls still needs the trait dictionary.
#
# The points, the domains, the order, the circle FFT, the folding and the DEEP quotient are transcribed over a field in stub/P3Circle/, with the abstractions each file lists.
state = "stub"

features = []

watch = ["circle/src", "circle/Cargo.toml", "util/src/lib.rs", "field/src/batch_inverse.rs",
  "mersenne-31/src/complex.rs"]

# The transcriptions. Hashes are pending tools/mirror.

