name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
      - name: Check the axioms of every claim
        run: python3 tools/check-claims.py
      - name: Check that STATUS.md is generated from this commit
        run: python3 tools/status.py --check

  arch-shims:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@v6
      - name: Check the runner has AVX2
        run: grep -qw avx2 /proc/cpuinfo
      - name: Check the differential tests are compiled in
        run: cargo test --locked --release --manifest-path arch/Cargo.toml --test avx2 -- --list | grep -q ': test$'
      - name: Test the arch shims against the intrinsics
        run: cargo test --locked --release --manifest-path arch/Cargo.toml
      - name: Check that each shim's recorded mutation fails the tests
        run: arch/check-mutations.sh

  arch-shims-neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Check the runner is AArch64 with NEON
        run: test "$(uname -m)" = aarch64 && grep -qw asimd /proc/cpuinfo
      - name: Check the differential tests are compiled in
        run: cargo test --locked --release --manifest-path arch/Cargo.toml --test neon -- --list | grep -q ': test$'
      - name: Test the arch shims against the intrinsics
        run: cargo test --locked --release --manifest-path arch/Cargo.toml
      - name: Check that each shim's recorded mutation fails the tests
        run: arch/check-mutations.sh
