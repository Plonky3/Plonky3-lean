name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
      - name: Check the axioms of every claim
        run: python3 tools/check-claims.py
      - name: Check that STATUS.md is generated from this commit
        run: python3 tools/status.py --check

  arch-shims:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx2
    steps:
      - uses: actions/checkout@v6
      - name: Check the runner has AVX2
        run: grep -qw avx2 /proc/cpuinfo
      - name: Check the differential tests are compiled in
        run: cargo test --locked --release --manifest-path arch/Cargo.toml --test avx2 -- --list | grep -q -- ' test$'
      - name: Test the arch shims against the intrinsics
        run: cargo test --locked --release --manifest-path arch/Cargo.toml
      - name: Check that each shim's recorded mutation fails the tests
        run: arch/check-mutations.sh

  # GitHub's x86 runners do not guarantee AVX-512. On one without it, the
  # differential tests cannot run: the job says so, and only checks that each
  # recorded mutation applies and compiles (TRUST.md).
  arch-shims-avx512:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+avx512f,+avx512bw,+avx512vl,+avx512vbmi2
    steps:
      - uses: actions/checkout@v6
      - name: Check whether the runner has AVX-512
        id: cpu
        run: |
          flags="$(grep -m1 '^flags' /proc/cpuinfo)"
          for f in avx512f avx512bw avx512vl avx512_vbmi2; do
            if ! printf '%s\n' "$flags" | grep -qw "$f"; then
              echo "avx512=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=AVX-512 shims not tested::skipped: no AVX-512 ($f) on this runner"
              echo "skipped: no AVX-512 ($f missing); the AVX-512 shims are not tested against the hardware"
              exit 0
            fi
          done
          echo "avx512=true" >> "$GITHUB_OUTPUT"
      - name: Check the differential tests are compiled in
        if: steps.cpu.outputs.avx512 == 'true'
        run: cargo test --locked --release --manifest-path arch/Cargo.toml --test avx512 -- --list | grep -q ': test$'
      - name: Test the AVX-512 shims against the intrinsics
        if: steps.cpu.outputs.avx512 == 'true'
        run: |
          cargo test --locked --release --manifest-path arch/Cargo.toml --test avx512 2>&1 | tee test.log
          ! grep -q '^skipped: no AVX-512' test.log
      - name: Check each shim's recorded mutation (fails the tests, or without AVX-512 compiles)
        run: arch/check-mutations.sh

  arch-shims-neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Check the runner is AArch64 with NEON
        run: test "$(uname -m)" = aarch64 && grep -qw asimd /proc/cpuinfo
      - name: Check the differential tests are compiled in
        run: cargo test --locked --release --manifest-path arch/Cargo.toml --test neon -- --list | grep -q -- ' test$'
      - name: Test the arch shims against the intrinsics
        run: cargo test --locked --release --manifest-path arch/Cargo.toml
      - name: Check that each shim's recorded mutation fails the tests
        run: arch/check-mutations.sh
