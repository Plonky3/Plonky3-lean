name = "Plonky3Lean"
version = "0.1.0"
defaultTargets = ["HaxExt", "P3BabyBear", "P3KoalaBear", "P3Util", "ToCompPoly", "Plonky3Lean"]

# The two Lean libraries the generated code imports. Both revs must equal what
# the hax release in toolchain.toml resolves (`cargo hax tools show`): the
# generated files and the libraries that interpret them come from one aeneas
# build, and a floating rev would let them drift apart silently.
#
# `Aeneas`: the Lean model of Rust (`RustM`, `Std.U32`, `Array`, `Slice`, the
# `⦃ ⦄` spec logic and `step`).
[[require]]
name = "aeneas"
git = "https://github.com/cryspen/aeneas"
rev = "build-41977a5"
subDir = "backends/lean"

# `CoreModels`: the Lean models of `core` and `alloc` that aeneas's output names.
[[require]]
name = "hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.34"

# Mathematical specifications of the fields (and, through it, mathlib). Its
# mathlib must be the one aeneas pins, so that the two share one mathlib.
# lake-manifest.json locks the exact commit.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "v4.35.0"

# Definitions `Aeneas` and `CoreModels` lack. See HaxExt.lean.
[[lean_lib]]
name = "HaxExt"

# Field specifications and lemmas staged for CompPoly, written in its namespaces
# so that each file moves upstream unchanged. See ToCompPoly/README.md.
[[lean_lib]]
name = "ToCompPoly"
leanOptions = { warningAsError = true }

# Hand-written claims, specifications and proofs. See Plonky3Lean.lean.
# Warnings are errors here, so a `sorry` fails the build whatever
# tools/check-claims.py lists. The generated libraries are left alone.
[[lean_lib]]
name = "Plonky3Lean"
leanOptions = { warningAsError = true }

# One library per crate under crates/, named after the library hax emits for the
# crate (`P3BabyBear` for p3-baby-bear) and rooted in the crate's `extraction/`
# or `stub/` directory, whichever its crate.toml `state` selects. Inside
# `extraction/` the layout is hax's own, so the module names the generated code
# imports resolve unchanged.

[[lean_lib]]
name = "P3BabyBear"
srcDir = "crates/baby-bear/extraction"

[[lean_lib]]
name = "P3Commit"
srcDir = "crates/commit/stub"

[[lean_lib]]
name = "P3Dft"
srcDir = "crates/dft/stub"

[[lean_lib]]
name = "P3BinaryDft"
srcDir = "crates/binary-dft/stub"

[[lean_lib]]
name = "P3Field"
srcDir = "crates/field/stub"

[[lean_lib]]
name = "P3Goldilocks"
srcDir = "crates/goldilocks/extraction"

[[lean_lib]]
name = "P3KoalaBear"
srcDir = "crates/koala-bear/extraction"

[[lean_lib]]
name = "P3Matrix"
srcDir = "crates/matrix/extraction"

[[lean_lib]]
name = "P3Mds"
srcDir = "crates/mds/extraction"

[[lean_lib]]
name = "P3Mersenne31"
srcDir = "crates/mersenne-31/extraction"

[[lean_lib]]
name = "P3Monty31"
srcDir = "crates/monty-31/extraction"

[[lean_lib]]
name = "P3Poseidon1"
srcDir = "crates/poseidon1/stub"

[[lean_lib]]
name = "P3Poseidon2"
srcDir = "crates/poseidon2/stub"

[[lean_lib]]
name = "P3Util"
srcDir = "crates/util/extraction"

[[lean_lib]]
