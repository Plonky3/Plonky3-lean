# Everything that turns Plonky3's Rust into Lean. One backend for the whole
# repository: models from different backends use different monads and integer
# types and do not compose in one Lake workspace, so a backend change is a branch.

[extractor]
# hax's `lean` backend: `cargo hax into lean` runs charon (Rust to LLBC) and
# aeneas (LLBC to Lean). The generated code imports `Aeneas` and `CoreModels`.
backend = "hax-lean"

# The cargo-hax build: `hax_commit` is the pin, and `hax_release` names the
# release whose tag `cargo-hax-v<release>` points to it, or is empty while the pin
# is a commit no release contains. A crates.io build reports
# `version=<hax_release>`; a build from git reports `commit=<hax_commit>`.
#
# Pinned to hax main: no release yet pins a charon with the fix for
# docs/extractor-issues.md 4 (charon nightly-2026.09.30 and later). This moves to
# the first release that does. Install it with
#   cargo install --locked --git https://github.com/cryspen/hax --rev <hax_commit> cargo-hax --force
hax_release = ""
hax_commit = "721d1a2710b1d7020a0b32de7291fe791885d215"

# The charon and aeneas builds that hax resolves by default
# (`cargo hax tools show`). Pinning hax pins them; they are restated here because
# a `hax.toml` anywhere above a crate would override them. `aeneas` must equal
# the `aeneas` require's `rev` in lakefile.toml.
charon = "nightly-2026.10.17"
aeneas = "build-41977a5"

# The rust toolchain charon's driver links against (from charon's own
# `rust-toolchain`), with the components it needs. `cargo check` of the
# pre-patched tree runs under the same nightly.
rust_toolchain = "nightly-2026-09-17"
rust_components = ["rustc-dev", "llvm-tools", "rust-src"]

# The target charon compiles the crates for. It has no SIMD, so every AVX2,
# AVX-512 and NEON backend is `cfg`-excluded and the models describe the portable
# scalar code paths only. hax does not pass a target on to charon, so the
# extraction passes it as charon's `--targets`.
target = "thumbv7em-none-eabi"

# Passed to charon on every run, for every crate. They restrict scope only:
# nothing here edits code that is translated, and STATUS.md counts each one.
#   Debug impls -> opaque: the impls stay (`MontyParameters: Debug` needs the
#                  witness), but their `core::fmt` bodies, which `CoreModels`
#                  does not model, become assumptions.
#   serde       -> excluded: `Field: Serialize + DeserializeOwned` pulls in
#                  serde's mutually recursive `Serializer` trait family.
# Charon splits option values on ',', so a pattern cannot contain one.
charon_args = [
  "--opaque", "{impl core::fmt::Debug for _}",
  "--exclude", "serde_core",
  "--exclude", "serde",
  "--exclude", "{impl serde_core::ser::Serialize for _}",
  "--exclude", "{impl serde_core::de::Deserialize for _}",
]

# The cfg every pre-extraction patch gates its changes on, set for every crate
# during extraction and never in a normal build. hax's Lean backend passes it to
# the crate it extracts, but the gated items live in that crate's dependencies,
# so it goes in RUSTFLAGS too.
rustflags = "--cfg hax_backend_lean"
